apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutriflow-frontend
  labels:
    app: nutriflow-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nutriflow-frontend

  template:
    metadata:
      labels:
        app: nutriflow-frontend

    spec:
      containers:
        - name: frontend

          image: 599499159844.dkr.ecr.ap-south-2.amazonaws.com/nutriflow-frontend:7

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: nutriflow-frontend

spec:
  selector:
    app: nutriflow-frontend

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP
